# Main nginx config for the openGym Railway image. The server block is upstream's own
# web/nginx.conf.template, rendered at start-up into /tmp/opengym/default.conf.
worker_processes auto;
pid /tmp/opengym/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    access_log off;

    client_body_temp_path /tmp/opengym/client_body;
    proxy_temp_path /tmp/opengym/proxy;
    fastcgi_temp_path /tmp/opengym/fastcgi;
    uwsgi_temp_path /tmp/opengym/uwsgi;
    scgi_temp_path /tmp/opengym/scgi;

    # Railway's edge is the only thing that reaches this port. It overwrites X-Real-IP with the
    # visitor's address (and X-Forwarded-For with "visitor, edge-hop"), dropping whatever a client
    # sent, so X-Real-IP is the trustworthy one. Upstream's server block then overwrites
    # X-Forwarded-For/X-Real-IP towards the API with it, so the API's sign-in throttle and activity
    # log count real visitors instead of lumping everyone in as the edge. Locally (no edge) the
    # header is absent and the socket address is used.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Real-IP;

    include /tmp/opengym/default.conf;
}
